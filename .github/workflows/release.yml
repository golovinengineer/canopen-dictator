name: Release

# A pushed tag vX.Y.Z builds Dictator.app and publishes a GitHub Release.
# Run by hand (workflow_dispatch), it only builds and uploads the zip as an
# Actions artifact: a dry run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app
    # assets/icon/Dictator.icon is saved by Icon Composer from Xcode 27;
    # Xcode 26's actool can't open it, and the macos-26 image has only
    # Xcode 26. The xcode-27 image (macOS 27) has Xcode 27.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "canopen-dictator"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo version $version (expected v$version)"
            exit 1
          fi

      - name: Build Dictator.app
        run: scripts/bundle-macos.sh

      - name: Upload artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Dictator-${{ steps.version.outputs.version }}-macos-universal
          path: |
            target/bundle/*.dmg
            target/bundle/*.zip
            target/bundle/*.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Installing on macOS

          With Homebrew (also links the `dictator` command):
          `brew install --cask golovinengineer/tap/dictator`

          Or by hand:

          1. Download `Dictator-*-macos-universal.dmg` below and open it.
          2. Drag `Dictator.app` onto the Applications folder next to it.
             (The `.zip` holds the same app, for scripts and Homebrew.)
          3. The app is not signed with an Apple Developer ID yet, so the first
             start is blocked. Open System Settings → Privacy & Security and click
             **Open Anyway**, or run once in a terminal:
             `xattr -dr com.apple.quarantine /Applications/Dictator.app`

          The same binary is the command line and terminal UI. Homebrew links it
          for you; after a manual install:
          `sudo mkdir -p /usr/local/bin && sudo ln -sf /Applications/Dictator.app/Contents/MacOS/dictator /usr/local/bin/dictator`
          EOF
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Dictator $VERSION" \
            --notes-file notes.md --generate-notes \
            "${prerelease[@]}" \
            target/bundle/*.dmg target/bundle/*.zip target/bundle/*.sha256

  # Point the cask in golovinengineer/homebrew-tap at the new release. Needs
  # the secret HOMEBREW_TAP_TOKEN (fine-grained token, contents read/write on
  # that repository only); without it the job only leaves a notice.
  homebrew:
    name: Homebrew tap
    needs: macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Casks/dictator.rb
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
            exit 0
          fi
          version=${TAG#v}
          sha=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/Dictator-$version-macos-universal.zip.sha256" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/golovinengineer/homebrew-tap.git" tap
          scripts/update-cask.sh tap/Casks/dictator.rb "$version" "$sha"
          cd tap
          if git diff --quiet; then
            echo "The cask is already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dictator $version"
          git push
