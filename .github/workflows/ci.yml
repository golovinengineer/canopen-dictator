name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Windows (clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Make dictatorw.exe
        shell: bash
        run: cargo build --locked && scripts/dictatorw.sh target/debug/dictator.exe
      - name: Check dictatorw.exe
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe")[0].FullName
          & $dumpbin /headers target\debug\dictatorw.exe | Select-String 'subsystem \(Windows GUI\)' -OutVariable gui
          if (-not $gui) { exit 1 }
          # Same program: run with its output captured, it prints as dictator.exe does.
          if ((target\debug\dictatorw.exe --version) -ne (target\debug\dictator.exe --version)) { exit 1 }

  linux:
    name: Linux (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Slint's font lookup; winit and the rfd portal load their libraries at run time.
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  linux-cli:
    name: Linux (command line only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test without GUI and TUI
        run: cargo test --workspace --locked --no-default-features

  cmake:
    name: Linux (CMake integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build without GUI and TUI
        run: cargo build --locked --no-default-features
      - name: CMake test project (Makefiles)
        run: tests/cmake/run.sh "$PWD/target/debug/dictator" "$RUNNER_TEMP/cmake-make"
      - name: CMake test project (Ninja)
        run: tests/cmake/run.sh "$PWD/target/debug/dictator" "$RUNNER_TEMP/cmake-ninja" -G Ninja
      - name: CMake test project via dictator cmake install
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/home"
          unset XDG_DATA_HOME
          dictator="$PWD/target/debug/dictator"
          "$dictator" cmake install
          cmake -S tests/cmake -B "$RUNNER_TEMP/cmake-installed"
          cmake --build "$RUNNER_TEMP/cmake-installed"
          "$dictator" cmake uninstall
          if cmake -S tests/cmake -B "$RUNNER_TEMP/cmake-uninstalled" >"$RUNNER_TEMP/uninstalled.log" 2>&1; then
            echo "FAIL: find_package(Dictator) still works after uninstall" >&2
            exit 1
          fi
          grep 'provided by "Dictator"' "$RUNNER_TEMP/uninstalled.log" || { cat "$RUNNER_TEMP/uninstalled.log"; exit 1; }

  action:
    name: Linux (GitHub Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's preinstalled Rust builds it, as for users of the action.
      - uses: ./
      - name: Check
        run: dictator check assets/example/example.od --strict
      - name: Export twice, same bytes
        run: |
          for out in od od2; do
            dictator export assets/example/example.od --c "$RUNNER_TEMP/$out/ObjDict.c" \
              --eds "$RUNNER_TEMP/$out/example.eds" --md "$RUNNER_TEMP/$out/example.md"
          done
          diff -r "$RUNNER_TEMP/od" "$RUNNER_TEMP/od2"
      - name: CMake test project via the action's cmake install
        run: |
          cmake -S tests/cmake -B "$RUNNER_TEMP/cmake"
          cmake --build "$RUNNER_TEMP/cmake"
