name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  linux-cli:
    name: Linux (command line only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test without GUI and TUI
        run: cargo test --workspace --locked --no-default-features

  cmake:
    name: Linux (CMake integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build without GUI and TUI
        run: cargo build --locked --no-default-features
      - name: CMake test project (Makefiles)
        run: tests/cmake/run.sh "$PWD/target/debug/dictator" "$RUNNER_TEMP/cmake-make"
      - name: CMake test project (Ninja)
        run: tests/cmake/run.sh "$PWD/target/debug/dictator" "$RUNNER_TEMP/cmake-ninja" -G Ninja
      - name: CMake test project via dictator cmake install
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/home"
          unset XDG_DATA_HOME
          dictator="$PWD/target/debug/dictator"
          "$dictator" cmake install
          cmake -S tests/cmake -B "$RUNNER_TEMP/cmake-installed"
          cmake --build "$RUNNER_TEMP/cmake-installed"
          "$dictator" cmake uninstall
          if cmake -S tests/cmake -B "$RUNNER_TEMP/cmake-uninstalled" >"$RUNNER_TEMP/uninstalled.log" 2>&1; then
            echo "FAIL: find_package(Dictator) still works after uninstall" >&2
            exit 1
          fi
          grep 'provided by "Dictator"' "$RUNNER_TEMP/uninstalled.log" || { cat "$RUNNER_TEMP/uninstalled.log"; exit 1; }
