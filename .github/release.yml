# Sections of the generated release notes (gh release create --generate-notes).
# A pull request goes into the first section whose label it has.
changelog:
  categories:
    - title: Fixes
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Packaging and CI
      labels:
        - packaging
        - testing
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
