format = 1

[device]
vendor_name = "Example Vendor"
vendor_id = "0"
product_name = "Example Device"
product_id = "1"
description = "Example device covering the object dictionary features used by Dictator's tests"
file_version = "1"
created_by = "Dictator tests"
created = "2026-01-01T15:00:00"
baud_rates = [125, 250, 500, 1000]
granularity = 8
rpdo_count = 4
tpdo_count = 4
lss_slave = true
dummy_usage = [2, 3, 4, 5, 6, 7]

[canfestival]
node_name = "ExampleDevice"
node_id = 0
node_type = "slave"
default_string_size = 10

[object.0x1000]
name = "Device type"
kind = "var"
storage_group = "PERSIST_COMM"
count_label = "NMT"
description = """
* bit 16-31: Additional information
* bit 0-15: Device profile number"""
type = "u32"
access = "ro"
default = "0x00000000"

[object.0x1001]
name = "Error register"
kind = "var"
count_label = "EM"
description = """
* bit 7: manufacturer specific
* bit 4: communication error
* bit 0: generic error"""
type = "u8"
access = "ro"
pdo = "tpdo"
default = "0x00"

[object.0x1003]
name = "Pre-defined error field"
kind = "array"
count_label = "EM"
sub = [
  { sub = 0x00, name = "Highest sub-index supported", type = "u8", access = "rw", default = "0x08" },
  { sub = 0x01, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x02, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x03, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x04, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x05, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x06, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x07, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
  { sub = 0x08, name = "Standard error field", type = "u32", access = "ro", default = "0x00000000" },
]

[object.0x1005]
name = "COB-ID SYNC message"
kind = "var"
storage_group = "PERSIST_COMM"
count_label = "SYNC"
type = "u32"
access = "rw"
default = "0x00000080"

[object.0x1006]
name = "Communication cycle period"
kind = "var"
storage_group = "PERSIST_COMM"
count_label = "SYNC_PROD"
type = "u32"
access = "rw"
default = "0"

[object.0x1007]
