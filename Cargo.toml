[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
roxmltree = "0.21.2"
dictator-core = { path = "crates/dictator-core" }
dictator-canfestival = { path = "crates/dictator-canfestival" }

[package]
name = "dictator"
description = "CANopen object dictionary editor"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
dictator-core.workspace = true
dictator-canfestival.workspace = true
rfd = "0.18.0"
slint = "1.19.0"
toml = "1.2.1"

[build-dependencies]
slint-build = "1.19.0"
