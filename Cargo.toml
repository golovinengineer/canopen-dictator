[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
roxmltree = "0.21.2"
dictator-core = { path = "crates/dictator-core" }
dictator-canfestival = { path = "crates/dictator-canfestival" }

[package]
name = "dictator"
description = "CANopen object dictionary editor"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
dictator-core.workspace = true
dictator-canfestival.workspace = true
ratatui = { version = "0.30.2", optional = true }
rfd = { version = "0.18.0", optional = true }
slint = { version = "1.19.0", optional = true }
toml = "1.2.1"

[build-dependencies]
slint-build = { version = "1.19.0", optional = true }

[features]
default = ["gui", "tui"]
# Slint window, for launching as an app.
gui = ["dep:slint", "dep:rfd", "dep:slint-build"]
# Ratatui terminal UI, for launching from a terminal.
tui = ["dep:ratatui"]
